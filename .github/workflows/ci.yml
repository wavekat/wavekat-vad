name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - name: Run tests
        run: cargo test --workspace 2>&1 | tee test-output.txt
      - run: cargo doc --no-deps -p wavekat-vad --all-features
      - name: Job summary
        if: always()
        run: |
          echo "## Check" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rustc --version >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-output.txt ]; then
            echo "### Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^test result:|^running' test-output.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "webrtc"
          - "silero"
          - "ten-vad"
          - "firered"
          - "earshot"
          - "serde"
          - "webrtc,silero,ten-vad,firered,earshot,serde"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test -p wavekat-vad --no-default-features --features "${{ matrix.features }}"

  earshot-isolation:
    # The pure-Rust earshot backend exists so hosts that already link WebRTC
    # can enable a VAD without pulling webrtc-vad's libfvad symbols in. Assert
    # that guarantee against the real resolver output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check_earshot_isolation.sh

  semver:
    # The crate promises a stable public API within a 0.1.x line. Compare the
    # branch's API against the published release so a breaking change has to
    # be a deliberate choice rather than something noticed after publishing.
    # all-features so the feature-gated backend modules are covered too; the
    # action installs its own toolchain and manages its own cache.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: wavekat-vad
          feature-group: all-features

  accuracy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Cache testset
        uses: actions/cache@v5
        with:
          path: target/testset
          key: ten-vad-testset-v1
      - name: Run accuracy regression check
        run: |
          cargo test --release -p wavekat-vad --no-default-features \
            --features webrtc,silero,ten-vad,firered,earshot \
            -- --ignored accuracy_report --nocapture 2>&1 | tee accuracy-output.txt
      - name: Job summary
        if: always()
        run: |
          echo "## Accuracy" >> "$GITHUB_STEP_SUMMARY"
          if [ -f accuracy-output.txt ]; then
            TABLE=$(grep '^|' accuracy-output.txt || true)
            if [ -n "$TABLE" ]; then
              echo "$TABLE" >> "$GITHUB_STEP_SUMMARY"
            else
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              grep -E '^test result:|^running' accuracy-output.txt >> "$GITHUB_STEP_SUMMARY" || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
